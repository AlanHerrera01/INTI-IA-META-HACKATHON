name: inti-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inti}
      POSTGRES_DB: inti
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inti -d inti"]
      interval: 5s
      timeout: 3s
      retries: 20
  demo:
    build: ./apps/demo-app
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://inti:${POSTGRES_PASSWORD:-inti}@postgres:5432/inti?connect_timeout=5
      ARTIFACT_DIR: /app/artifacts
      DEMO_URL: http://demo:8001/
      BROWSER_ALLOWED_URLS: '["http://demo:8001/"]'
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      META_API_KEY: ${META_API_KEY:-}
      META_MODEL_ID: ${META_MODEL_ID:-muse-spark-1.3}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_REQUEST_TIMEOUT_SECONDS: ${META_REQUEST_TIMEOUT_SECONDS:-60}
      PLANNING_MAX_STEPS: ${PLANNING_MAX_STEPS:-20}
      PLANNING_MAX_RETRIES: ${PLANNING_MAX_RETRIES:-2}
      PLANNING_MAX_TOKENS: ${PLANNING_MAX_TOKENS:-4096}
      PLANNING_TIMEOUT_SECONDS: ${PLANNING_TIMEOUT_SECONDS:-120}
      PLANNING_TTL_SECONDS: ${PLANNING_TTL_SECONDS:-900}
      PLANNING_MIN_CONFIDENCE: ${PLANNING_MIN_CONFIDENCE:-0.6}
      META_MAX_RESPONSE_BYTES: ${META_MAX_RESPONSE_BYTES:-262144}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifacts:/app/artifacts"]
    shm_size: 256mb
    depends_on:
      postgres: {condition: service_healthy}
      demo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 15
  frontend:
    build: ./apps/frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  artifacts:
