name: inti-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inti}
      POSTGRES_DB: inti
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inti -d inti"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.local
    environment:
      INTI_RUNTIME_MODE: local_computer
      DATABASE_URL: postgresql+psycopg://inti:${POSTGRES_PASSWORD:-inti}@postgres:5432/inti?connect_timeout=5
      ARTIFACT_DIR: /app/artifacts
      EXECUTION_OPERATOR_TOKEN: ${EXECUTION_OPERATOR_TOKEN:?Set a private operator token in .env}
      EXECUTION_ENABLED: "false"
      VERIFICATION_ENABLED: "false"
      RECOVERY_ENABLED: "false"
      DEMO_CONTROLS_ENABLED: "false"
      MISSION_MODEL_CALLS_ENABLED: "false"
      META_API_KEY: ${META_API_KEY:-}
      META_MODEL_ID: ${META_MODEL_ID:-muse-spark-1.3}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifacts:/app/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 15
  frontend:
    build: ./apps/frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  artifacts:
