<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTI Inventory · Synthetic equipment</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#19283b;font:15px system-ui}header{background:#102238;color:white;padding:24px 6%;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}header span{color:#a8bdcf}main{max-width:1150px;margin:48px auto;padding:0 24px}small{letter-spacing:2px;color:#547387}h1{font-size:34px;margin:10px 0}p{color:#637488}.toolbar{display:flex;justify-content:space-between;gap:20px;margin:30px 0}input,select{font:inherit;padding:11px;border:1px solid #d2dce5;border-radius:6px;background:white;color:#19283b}#search{width:340px}table{border-collapse:collapse;width:100%;background:white;border:1px solid #e0e5eb}th,td{text-align:left;padding:18px;border-bottom:1px solid #e7ebf0}th{font-size:12px;color:#617488;background:#eef2f6;letter-spacing:1px}td input{max-width:240px;width:100%}button{background:#087f91;color:white;border:0;border-radius:6px;padding:12px 24px;cursor:pointer;font:inherit}.note{margin-top:24px;font-size:13px}#notice{color:#087f67;min-height:24px}@media(max-width:700px){main{overflow:auto}.toolbar{flex-direction:column}}
</style></head><body>
<header><b>◈ INTI / Inventory</b><span>Authorized local sandbox</span></header>
<main><small>OPERATIONS / EQUIPMENT</small><h1>Equipment inventory</h1><p>Review and update your workspace equipment.</p>
<div class="toolbar"><input id="search" aria-label="Search equipment" placeholder="Search equipment or asset ID…"><button id="save">Save changes</button></div>
<table><thead><tr><th>ASSET ID</th><th>EQUIPMENT</th><th>LOCATION</th><th>STATUS</th></tr></thead><tbody id="records"></tbody></table>
<p id="notice" role="status"></p><p class="note">Synthetic demo data · Changes remain in this browser session only.</p></main>
<script>
const items=[{id:'EQ-001',name:'Andes Workstation',location:'Quito Lab',status:'Available'},{id:'EQ-002',name:'Solar Camera',location:'Cuenca Lab',status:'In use'},{id:'EQ-003',name:'Field Sensor Kit',location:'Loja Lab',status:'Maintenance'},{id:'EQ-004',name:'Network Switch',location:'Quito Lab',status:'Available'}];
function render(){const rows=document.querySelector('#records');rows.replaceChildren();const query=document.querySelector('#search').value.toLowerCase();items.filter(x=>(x.id+' '+x.name).toLowerCase().includes(query)).forEach(x=>{const row=document.createElement('tr');const id=document.createElement('td');id.textContent=x.id;row.append(id);for(const field of ['name','location']){const td=document.createElement('td');const input=document.createElement('input');input.value=x[field];input.setAttribute('aria-label',x.id+' '+field);input.oninput=()=>x[field]=input.value;td.append(input);row.append(td)}const td=document.createElement('td');const select=document.createElement('select');select.setAttribute('aria-label',x.id+' status');for(const value of ['Available','In use','Maintenance']){const option=document.createElement('option');option.textContent=value;option.selected=x.status===value;select.append(option)}select.onchange=()=>x.status=select.value;td.append(select);row.append(td);rows.append(row)});}
document.querySelector('#search').oninput=render;document.querySelector('#save').onclick=()=>{document.querySelector('#notice').textContent='Changes saved in this session.'};render();
</script></body></html>
